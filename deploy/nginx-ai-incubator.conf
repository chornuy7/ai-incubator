# nginx для AI Incubator — отдаёт панель по IP сервера.
# Кладётся в /etc/nginx/sites-available/ai-incubator, симлинк в sites-enabled.
#
# ВАЖНО: панель управляет реальными Telegram-аккаунтами, а её API не требует авторизации
# (accessGuard fail-open + открытый CORS). Поэтому наружу выпускаем ТОЛЬКО за паролем.
# Node при этом слушает 127.0.0.1 и напрямую из интернета недоступен.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Basic Auth на весь сайт. Файл создаётся так:
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd incubator
    auth_basic           "AI Incubator";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Медиа в мейлинге/автопостинге + §2: загрузка папок с аккаунтами через браузер.
    # Одна tdata — десятки мегабайт, пачка из 10 аккаунтов легко даёт полгигабайта.
    client_max_body_size 1024m;
    # Заливка большой пачки идёт долго — не рвём соединение по умолчанию (60с).
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    access_log /var/log/nginx/ai-incubator.access.log;
    error_log  /var/log/nginx/ai-incubator.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Долгие операции: проверка прокси (TCP+гео), AIR-рейтинг по пачке аккаунтов,
        # парсинг. Дефолтных 60с не хватает.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
